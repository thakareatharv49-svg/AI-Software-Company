name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install
        run: python -m pip install --upgrade pip && pip install -e ".[dev]"
      - name: Ruff
        run: |
          files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}...${{ github.sha }}" -- '*.py')
          if [ -n "$files" ]; then
            ruff check $files
          else
            echo "No Python files changed."
          fi
      - name: Tests
        run: pytest -q
